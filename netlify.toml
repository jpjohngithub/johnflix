[build]
  publish = "public"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/proxy-stream"
  function = "stream-proxy"

[[edge_functions]]
  path = "/api/*"
  function = "api-edge"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
