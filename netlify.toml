[build]
  publish = "public"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/api/proxy-stream"
  function = "stream-proxy"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
